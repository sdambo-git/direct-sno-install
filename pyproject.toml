[project]
name = "dsx-air-ocp"
version = "0.1.0"
description = "OpenShift on NVIDIA DSX Air via Assisted Installer discovery ISO"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aicli>=99.0.0",
    "nv-air-sdk>=1.6.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.27.1",
]

[project.scripts]
dsx-air = "dsx_air.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["scripts/dsx_air"]

[tool.hatch.build.targets.wheel.sources]
"scripts/dsx_air" = "dsx_air"
