# Copy into ibi-iso-workdir/ then fill sshKey + pullSecret locally
# (never commit secrets; use a *.local.yaml overlay if needed).
#   openshift-install image-based create image --dir ibi-iso-workdir
# Use openshift-install 4.22.14. Seed SNO is Assisted user-managed networking
# with DHCP on the OOB NIC (no API/Ingress VIP). Omit networkConfig for DHCP.
#
# Live seed (oc debug node/ocp-cp-0, 300GiB /dev/vda):
#   vda4 99.5GiB root; vda5 199GiB var-lib-containers starting at 100GiB
apiVersion: v1beta1
kind: ImageBasedInstallationConfig
metadata:
  name: dsx-ibi
seedImage: quay.io/sdambo/ocp-seed:4.22.14
seedVersion: "4.22.14"
installationDisk: /dev/vda
extraPartitionLabel: var-lib-containers
extraPartitionStart: "100GiB"
extraPartitionNumber: 5
sshKey: 'ssh-ed25519 AAAA...'
pullSecret: '{"auths": ...}'
# Seed used DHCP (user-managed, no VIPs). Leave networkConfig unset unless
# the target needs static IPs. For static NMState, install nmstatectl on the
# machine that runs openshift-install, then e.g.:
# networkConfig:
#   interfaces:
#     - name: eth0
#       type: ethernet
#       state: up
#       ipv4:
#         enabled: true
#         dhcp: true
#       ipv6:
#         enabled: false
